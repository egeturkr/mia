# Netlify deploy config — alternative to vercel.json if hosting on Netlify.
# Cowork mode: this file is harmless on other hosts (they'll ignore it).

[build]
  publish = "."
  functions = "netlify/functions"

# Serverless proxy for Roboflow inference — must come before the SPA-style rules.
[[redirects]]
  from = "/api/detect"
  to = "/.netlify/functions/detect"
  status = 200

# Serverless e-posta bildirimi (Resend) — anahtar sunucuda kalır.
[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

# Tarama ingestion (RFID/QR geçiş noktası okuyucuları) — Sprint 4.
[[redirects]]
  from = "/api/scan"
  to = "/.netlify/functions/scan"
  status = 200

# Korumalı Modal video analiz proxy'si — Faz 1 (Modal URL env'de, MODAL_URL).
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

# Sağlık & yapılandırma kontrolü — Faz 4.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Kullanım & plan özeti — Faz 5.
[[redirects]]
  from = "/api/usage"
  to = "/.netlify/functions/usage"
  status = 200

# Ödeme sağlayıcı webhook'u (sağlayıcıdan bağımsız stub) — Faz 5.
[[redirects]]
  from = "/api/billing-webhook"
  to = "/.netlify/functions/billing-webhook"
  status = 200

# Ödeme başlatma / sağlayıcı soyutlaması — Faz 6.
[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

# Haftalık güvenlik özeti — her Pazartesi 07:00 UTC.
[functions."weekly-digest"]
  schedule = "0 7 * * 1"

# api_usage log temizliği — her gün 03:00 UTC (60 günden eskiyi sil).
[functions."cleanup"]
  schedule = "0 3 * * *"

[[redirects]]
  from = "/pilot"
  to = "/pilot.html"
  status = 200

[[redirects]]
  from = "/organization"
  to = "/organization.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/detector.html"
  status = 302

[[redirects]]
  from = "/demo.html"
  to = "/detector.html"
  status = 302

[[redirects]]
  from = "/login"
  to = "/giris-yap.html"
  status = 301

[[redirects]]
  from = "/login.html"
  to = "/giris-yap.html"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/kaydol.html"
  status = 301

[[redirects]]
  from = "/register"
  to = "/kaydol.html"
  status = 301

[[redirects]]
  from = "/verify"
  to = "/dogrulama.html"
  status = 302

[[redirects]]
  from = "/reset-password"
  to = "/sifre-sifirla.html"
  status = 301

# Clean-URL aliases — Netlify auto-resolves /giris-yap → /giris-yap.html
[[redirects]]
  from = "/giris-yap"
  to = "/giris-yap.html"
  status = 200

[[redirects]]
  from = "/kaydol"
  to = "/kaydol.html"
  status = 200

[[redirects]]
  from = "/dogrulama"
  to = "/dogrulama.html"
  status = 200

[[redirects]]
  from = "/sifre-sifirla"
  to = "/sifre-sifirla.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
