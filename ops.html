<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Ops</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('mia_theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .op-wrap{max-width:1100px;margin:0 auto;padding:7rem 1.25rem 4rem}
        .op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-bottom:1.1rem}
        .op-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:.9rem 1.1rem}
        .op-card .v{font-size:1.3rem;font-weight:800}
        .op-card .l{font-size:.72rem;color:var(--text-muted);margin-top:.15rem}
        .op-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem;margin-bottom:1.1rem}
        .op-panel h2{font-size:1rem;margin:0 0 .8rem}
        table.op-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
        table.op-tbl th,table.op-tbl td{padding:.45rem .55rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
        table.op-tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
        .op-b{display:inline-block;padding:.13rem .55rem;border-radius:99px;font-size:.68rem;font-weight:700}
        .op-ok{background:rgba(34,197,94,.12);color:#22c55e}
        .op-warn{background:rgba(212,175,55,.13);color:#D4AF37}
        .op-bad{background:rgba(239,68,68,.12);color:#ef4444}
        .op-muted{color:var(--text-muted);font-size:.82rem}
    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html"><img src="images/logo-horizontal-trim.png" alt="MIA" class="logo-img"></a>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Müşteriler</a>
            <a href="ops.html" class="active">Ops</a>
            <span class="user-email" id="userEmail"></span>
            <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Çıkış</button>
        </nav>
    </header>

    <main class="op-wrap">
        <h1 style="margin:0 0 .25rem;">Operasyon Durumu</h1>
        <p class="op-muted" style="margin:0 0 1rem;">İç izleme paneli — yalnız MIA ekibi (crm_admins). Loglar sır/token/video içermez.</p>

        <div class="op-panel">
            <h2>Sistem Sağlığı <span class="op-muted" id="opHealthTime"></span></h2>
            <div class="op-grid" id="opHealth"><div class="op-muted">Yükleniyor…</div></div>
        </div>

        <div class="op-panel">
            <h2>Operasyonel Metrikler <span class="op-muted">(24 saat / 7 gün)</span></h2>
            <div class="op-grid" id="opMetrics"><div class="op-muted">Yükleniyor…</div></div>
        </div>

        <div class="op-panel">
            <h2>Son Hatalar</h2>
            <div id="opErrors" class="op-muted">Yükleniyor…</div>
        </div>

        <div class="op-panel">
            <h2>Son Olaylar</h2>
            <div id="opEvents" class="op-muted">Yükleniyor…</div>
        </div>
    </main>

    <footer><p>© 2026 MIA - Tüm hakları saklıdır.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
    (function () {
        function $(id) { return document.getElementById(id); }
        var esc = window.miaEsc || function (s) { return String(s == null ? "" : s); };
        function fmtT(d) { return d ? new Date(d).toLocaleString("tr-TR") : "—"; }
        function badge(status) {
            var cls = (status === "healthy" || status === "configured" || status === "manual" || status === "ok") ? "op-ok"
                : (status === "down" || status === "missing" || status === "critical" || status === "error") ? "op-bad" : "op-warn";
            return '<span class="op-b ' + cls + '">' + esc(status) + '</span>';
        }
        function card(v, l) { return '<div class="op-card"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div></div>'; }

        // 1) Sağlık — /api/health (kamuya açık güvenli uç)
        function loadHealth() {
            fetch("/api/health").then(function (r) { return r.json(); }).then(function (h) {
                var c = h.checks || {};
                $("opHealth").innerHTML =
                    card(badge(h.health || h.status), "Genel") +
                    card(badge(c.supabase || "unknown"), "Supabase" + (c.supabase_latency_ms != null ? " (" + c.supabase_latency_ms + "ms)" : "")) +
                    card(badge(c.ai_config || "unknown"), "AI yapılandırma") +
                    card(badge(c.billing || "unknown"), "Billing") +
                    card(badge(c.email || "unknown"), "E-posta");
                $("opHealthTime").textContent = "— " + fmtT(h.time);
            }).catch(function () { $("opHealth").innerHTML = '<div class="op-muted">Health ucu erişilemedi.</div>'; });
        }

        // 2) Metrikler — gerçek tablo sayımları (head:true + count). Veri yoksa 0.
        function count(table, sinceIso, extra) {
            var q = supabase.from(table).select("*", { count: "exact", head: true });
            if (sinceIso) q = q.gte("created_at", sinceIso);
            if (extra) extra.forEach(function (e) { q = q.eq(e[0], e[1]); });
            return q.then(function (r) { return r.error ? "—" : (r.count || 0); });
        }
        function loadMetrics() {
            var d1 = new Date(Date.now() - 24 * 3600e3).toISOString();
            var d7 = new Date(Date.now() - 7 * 24 * 3600e3).toISOString();
            Promise.all([
                count("analyses", d1), count("analyses", d7),
                count("report_exports", d1), count("report_exports", d7),
                count("system_events", d1, [["event_type", "quota_exceeded"]]),
                count("system_errors", d1), count("system_errors", d7),
                count("system_events", d1, [["source", "billing"]]),
            ]).then(function (m) {
                $("opMetrics").innerHTML =
                    card(m[0] + " / " + m[1], "Analiz (24s/7g)") +
                    card(m[2] + " / " + m[3], "Rapor export (24s/7g)") +
                    card(m[4], "Kota bloğu (24s)") +
                    card(m[5] + " / " + m[6], "Hata (24s/7g)") +
                    card(m[7], "Billing olayı (24s)");
            });
        }

        // 3) Hatalar (yalnız crm_admins okuyabilir — RLS)
        function loadErrors() {
            supabase.from("system_errors").select("*").order("created_at", { ascending: false }).limit(15)
                .then(function (r) {
                    if (r.error) { $("opErrors").textContent = "Erişim yok (crm_admins gerekli) veya migration koşulmadı."; return; }
                    if (!(r.data || []).length) { $("opErrors").innerHTML = '<span class="op-muted">Kayıtlı hata yok 🎉</span>'; return; }
                    var html = '<table class="op-tbl"><thead><tr><th>Zaman</th><th>Önem</th><th>Kaynak</th><th>Mesaj</th><th>Durum</th></tr></thead><tbody>';
                    r.data.forEach(function (e) {
                        html += "<tr><td>" + fmtT(e.created_at) + "</td><td>" + badge(e.severity) + "</td><td>" +
                            esc(e.source) + (e.function_name ? "/" + esc(e.function_name) : "") + "</td><td>" +
                            esc((e.message || "").slice(0, 140)) + "</td><td>" +
                            (e.resolved ? badge("ok") : '<button type="button" class="btn btn-secondary btn-sm" data-res="' + e.id + '">Çözüldü</button>') + "</td></tr>";
                    });
                    $("opErrors").innerHTML = html + "</tbody></table>";
                    Array.prototype.forEach.call($("opErrors").querySelectorAll("[data-res]"), function (b) {
                        b.addEventListener("click", function () {
                            supabase.from("system_errors").update({ resolved: true, resolved_at: new Date().toISOString() })
                                .eq("id", b.getAttribute("data-res")).then(loadErrors);
                        });
                    });
                });
        }

        // 4) Olaylar
        function loadEvents() {
            supabase.from("system_events").select("*").order("created_at", { ascending: false }).limit(20)
                .then(function (r) {
                    if (r.error) { $("opEvents").textContent = "Erişim yok (crm_admins gerekli) veya migration koşulmadı."; return; }
                    if (!(r.data || []).length) { $("opEvents").innerHTML = '<span class="op-muted">Henüz olay yok.</span>'; return; }
                    var html = '<table class="op-tbl"><thead><tr><th>Zaman</th><th>Olay</th><th>Kaynak</th><th>Detay</th></tr></thead><tbody>';
                    r.data.forEach(function (e) {
                        html += "<tr><td>" + fmtT(e.created_at) + "</td><td><b>" + esc(e.event_type) + "</b></td><td>" +
                            esc(e.source) + "</td><td class='op-muted'>" +
                            esc(e.metadata ? JSON.stringify(e.metadata).slice(0, 80) : "") + "</td></tr>";
                    });
                    $("opEvents").innerHTML = html + "</tbody></table>";
                });
        }

        supabase.auth.getSession().then(function (r) {
            if (!r.data.session) { window.location.href = "giris-yap.html?next=ops.html"; return; }
            loadHealth(); loadMetrics(); loadErrors(); loadEvents();
        });
    })();
    </script>
</body>
</html>
