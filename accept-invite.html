<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Ekip Daveti</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('mia_theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html"><img src="images/logo-horizontal-trim.png" alt="MIA" class="logo-img"></a>
        <nav><a href="giris-yap.html" class="btn btn-secondary btn-sm">Giriş Yap</a></nav>
    </header>
    <main class="page-inner" style="display:flex;align-items:center;justify-content:center;min-height:70vh;padding:7rem 1rem 3rem;">
        <div style="max-width:460px;width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;">
            <div style="font-size:1.6rem;font-weight:800;color:#D4AF37;margin-bottom:.6rem;">MIA</div>
            <h1 style="font-size:1.2rem;margin:0 0 .8rem;">Ekip Daveti</h1>
            <p id="aiMsg" style="color:var(--text-secondary);font-size:.92rem;line-height:1.6;">Davet doğrulanıyor…</p>
            <div id="aiActions" style="margin-top:1.2rem;"></div>
        </div>
    </main>
    <footer><p>© 2026 MIA - Tüm hakları saklıdır.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
    (function () {
        var msg = document.getElementById("aiMsg");
        var act = document.getElementById("aiActions");
        var ERR_TR = {
            auth_required: "Daveti kabul etmek için önce giriş yapmalısın (davet edilen e-posta ile).",
            invalid_token: "Davet linki geçersiz.",
            not_pending: "Bu davet daha önce kullanılmış veya iptal edilmiş.",
            expired: "Davetin süresi dolmuş. Yöneticinden yeni davet iste.",
            email_mismatch: "Bu davet farklı bir e-posta adresine gönderilmiş. Davet edilen e-posta ile giriş yap."
        };
        function getToken() {
            try { return new URL(location.href).searchParams.get("token") || ""; } catch (e) { return ""; }
        }
        function btn(href, label, primary) {
            return '<a href="' + href + '" class="btn ' + (primary ? "btn-primary" : "btn-secondary") + '">' + label + '</a> ';
        }
        function run() {
            var token = getToken();
            if (!token) { msg.textContent = "Davet linki eksik veya hatalı."; return; }
            supabase.auth.getSession().then(function (r) {
                if (!r.data.session) {
                    msg.textContent = ERR_TR.auth_required;
                    var next = encodeURIComponent("accept-invite.html?token=" + token);
                    act.innerHTML = btn("giris-yap.html?next=" + next, "Giriş Yap", true) + btn("kaydol.html", "Hesap Oluştur");
                    return;
                }
                supabase.rpc("accept_org_invite", { p_token: token }).then(function (res) {
                    var d = res.data;
                    if (res.error || !d || !d.ok) {
                        var code = (d && d.error) || "invalid_token";
                        msg.textContent = ERR_TR[code] || ("Davet kabul edilemedi: " + (res.error ? res.error.message : code));
                        act.innerHTML = btn("index.html", "Ana Sayfa");
                        return;
                    }
                    try { localStorage.setItem("mia_org", d.org_id); } catch (e) {}
                    msg.innerHTML = "<b style='color:#22c55e;'>✓ Ekibe katıldın!</b><br>" +
                        "Organizasyon: <b>" + String(d.org_name || "").replace(/[<>&]/g, "") + "</b><br>Rolün: <b>" + d.role + "</b>";
                    act.innerHTML = btn("dashboard.html", "Dashboard'a Git", true) + btn("organization.html", "Organizasyon");
                });
            });
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
    })();
    </script>
</body>
</html>
