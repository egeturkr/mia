<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <!-- CSP: yalnız yerel kaynaklar (mia:// şeması) + Supabase.
         'wasm-unsafe-eval' → onnxruntime-web WASM; media-src mia: → yerel video analizi. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        media-src 'self' mia: blob:;
        connect-src 'self' https://qojtokomfcporcglrsdy.supabase.co;
        font-src 'self';
        worker-src 'self' blob:;
    ">
    <title>MIA AI Safety Intelligence</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="shell">
        <aside id="sidebar" style="display:none"></aside>
        <div id="mainCol">
            <header id="topbar" style="display:none"></header>
            <main id="main"></main>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <!-- Vendor (npm'den scripts/copy-vendor.js ile kopyalanır — CDN YOK, offline çalışır) -->
    <script src="vendor/supabase.js"></script>
    <script src="vendor/ort.min.js"></script>

    <script src="js/i18n.js"></script>
    <script src="js/core.js"></script>
    <script src="js/detect.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/events.js"></script>
    <script src="js/sources.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
