<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - İhlal Raporları</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A0A0A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('mia_theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .ev-toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin:1rem 0 1.5rem}
        .ev-toolbar select{background:var(--surface,#161616);color:inherit;border:1px solid rgba(212,175,55,.25);border-radius:8px;padding:.5rem .75rem;font:inherit}
        .ev-spacer{flex:1}
        .ev-table-wrap{overflow-x:auto;border:1px solid rgba(212,175,55,.15);border-radius:12px}
        table.ev-table{width:100%;border-collapse:collapse;font-size:.92rem}
        table.ev-table th,table.ev-table td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
        table.ev-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:#8a8a8a;background:rgba(255,255,255,.02)}
        .ev-badge{display:inline-block;padding:.15rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600}
        .ev-high{background:rgba(239,68,68,.15);color:#ef4444}
        .ev-med{background:rgba(212,175,55,.15);color:#D4AF37}
        .ev-low{background:rgba(34,197,94,.15);color:#22c55e}
        .ev-empty{padding:3rem 1rem;text-align:center;color:#8a8a8a}
        .ev-note{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:10px;padding:.8rem 1rem;font-size:.88rem;color:#c9b27a;margin-bottom:1rem}
    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html"><img src="images/logo-horizontal-trim.png" alt="MIA" class="logo-img"></a>
        <nav>
            <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
            <a href="sirket.html" data-i18n="nav_company">Şirket</a>
            <a href="cozumler.html" data-i18n="nav_pricing">Çözümler</a>
            <a href="iletisim.html" data-i18n="nav_contact">İletişim</a>
            <div class="nav-divider"></div>
            <div id="loggedOutNav">
                <a href="giris-yap.html" class="btn btn-secondary btn-sm" data-i18n="nav_login">Giriş Yap</a>
                <a href="kaydol.html" class="btn btn-primary btn-sm" data-i18n="nav_signup">Kaydol</a>
            </div>
            <div id="loggedInNav" style="display:none;">
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html" class="active">İhlal Raporu</a>
                <a href="detector.html" data-i18n="nav_analysis">Analiz</a>
                <span class="user-email" id="userEmail"></span>
                <button type="button" id="navLogout" class="btn btn-secondary btn-sm" data-i18n="nav_logout">Çıkış</button>
            </div>
        </nav>
    </header>

    <main class="page-inner page-dashboard">
        <div class="dashboard-container">
            <div class="dashboard-header">
                <div>
                    <h1 id="evTitle">İhlal Raporu</h1>
                    <p class="dash-sub" id="evSub">Tüm analizlerdeki KKD ihlalleri — olay bazında</p>
                </div>
            </div>

            <div class="dashboard-stats">
                <div class="dash-stat-card"><div class="dash-stat-label" id="lblTotal">Toplam İhlal</div><div class="dash-stat-value bad" id="evTotal">0</div></div>
                <div class="dash-stat-card"><div class="dash-stat-label" id="lblHigh">Yüksek Risk</div><div class="dash-stat-value bad" id="evHigh">0</div></div>
                <div class="dash-stat-card"><div class="dash-stat-label" id="lblHardhat">Baret İhlali</div><div class="dash-stat-value" id="evHardhat">0</div></div>
                <div class="dash-stat-card"><div class="dash-stat-label" id="lblVest">Yelek İhlali</div><div class="dash-stat-value" id="evVest">0</div></div>
            </div>

            <div id="evNote" class="ev-note" style="display:none;"></div>

            <div class="ev-toolbar">
                <select id="fPeriod">
                    <option value="all">Tüm Zamanlar</option>
                    <option value="month" selected>Bu Ay</option>
                    <option value="week">Bu Hafta</option>
                </select>
                <select id="fRisk">
                    <option value="all">Tüm Riskler</option>
                    <option value="Yüksek">Yüksek</option>
                    <option value="Orta">Orta</option>
                    <option value="Düşük">Düşük</option>
                </select>
                <select id="fPpe">
                    <option value="all">Tüm KKD</option>
                    <option value="Baret">Baret</option>
                    <option value="Yelek">Yelek</option>
                    <option value="Maske">Maske</option>
                </select>
                <div class="ev-spacer"></div>
                <button type="button" id="btnCsv" class="btn btn-secondary btn-sm">CSV</button>
                <button type="button" id="btnPdf" class="btn btn-success btn-sm">PDF</button>
            </div>

            <div class="ev-table-wrap">
                <table class="ev-table">
                    <thead><tr>
                        <th id="thDate">Tarih</th><th id="thVideo">Analiz</th><th id="thTime">Zaman</th>
                        <th id="thType">İhlal</th><th id="thPpe">KKD</th><th id="thRisk">Risk</th><th id="thConf">Güven</th>
                    </tr></thead>
                    <tbody id="evBody"><tr><td colspan="7" class="ev-empty">Yükleniyor…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer><p data-i18n="footer">© 2026 MIA - Tüm hakları saklıdır.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
