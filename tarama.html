<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MIA - KKD Tarama</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A0A0A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('mia_theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .scan-wrap{max-width:560px;margin:0 auto;padding:1rem}
        .scan-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
        #reader{width:100%;border-radius:14px;overflow:hidden;border:1px solid rgba(212,175,55,.25)}
        .scan-cp{width:100%;background:var(--surface,#161616);color:inherit;border:1px solid rgba(212,175,55,.25);border-radius:10px;padding:.7rem;font:inherit;margin-bottom:1rem}
        .scan-status{border-radius:14px;padding:1.1rem;margin-top:1rem;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
        .scan-worker{font-size:1.15rem;font-weight:700;margin-bottom:.2rem}
        .scan-worker.unknown{color:#ef4444}
        .ppe-row{display:flex;gap:.6rem;margin:.8rem 0}
        .ppe-chip{flex:1;text-align:center;padding:.7rem .4rem;border-radius:10px;font-weight:600;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#8a8a8a}
        .ppe-chip.on{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#22c55e}
        .ppe-chip.miss{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#ef4444}
        .verdict{text-align:center;font-size:1.3rem;font-weight:800;padding:.8rem;border-radius:12px;margin:.6rem 0}
        .verdict.ok{background:rgba(34,197,94,.15);color:#22c55e}
        .verdict.bad{background:rgba(239,68,68,.15);color:#ef4444}
        .verdict.idle{background:rgba(255,255,255,.04);color:#8a8a8a;font-size:1rem;font-weight:600}
        .scan-actions{display:flex;gap:.6rem;margin-top:.8rem}
        .scan-actions .btn{flex:1}
        .scan-toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#161616;border:1px solid rgba(212,175,55,.3);color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
        .scan-toast.show{opacity:1}
        .scan-hint{font-size:.85rem;color:#8a8a8a;margin-top:.4rem;text-align:center}
    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html"><img src="images/logo-horizontal-trim.png" alt="MIA" class="logo-img"></a>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">İhlal Raporu</a>
            <a href="tarama.html" class="active">Tarama</a>
            <span class="user-email" id="userEmail"></span>
            <button type="button" id="navLogout" class="btn btn-secondary btn-sm">Çıkış</button>
        </nav>
    </header>

    <main class="page-inner">
        <div class="scan-wrap">
            <div class="scan-head">
                <h1 style="margin:0;">KKD Tarama</h1>
                <a href="qr-uret.html" class="btn btn-secondary btn-sm">QR Üret</a>
            </div>

            <select id="checkpoint" class="scan-cp"><option value="">Geçiş noktası seç (opsiyonel)</option></select>

            <div id="reader"></div>
            <div class="scan-hint" id="scanHint">İşçi rozetini, sonra baret/yelek QR'ını okutun.</div>

            <div class="scan-status">
                <div class="scan-worker unknown" id="workerName">İşçi okutulmadı</div>
                <div class="ppe-row">
                    <div class="ppe-chip" id="chipHelmet">Baret</div>
                    <div class="ppe-chip" id="chipVest">Yelek</div>
                </div>
                <div class="verdict idle" id="verdict">Bekleniyor…</div>
                <div class="scan-actions">
                    <button type="button" class="btn btn-primary" id="btnSave" disabled>Kaydet & Sıradaki</button>
                    <button type="button" class="btn btn-secondary" id="btnReset">Sıfırla</button>
                </div>
            </div>
        </div>
    </main>

    <div class="scan-toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tarama.js"></script>
</body>
</html>
