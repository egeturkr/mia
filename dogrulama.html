<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/logo-horizontal.webp" alt="MIA" class="logo-img">
        </a>
        <nav>
            <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
            <a href="sirket.html" data-i18n="nav_company">Şirket</a>
            <a href="cozumler.html" data-i18n="nav_pricing">Çözümler</a>
            <a href="iletisim.html" data-i18n="nav_contact">İletişim</a>
            <div class="nav-divider"></div>
            <div id="loggedOutNav">
                <a href="giris-yap.html" class="btn btn-secondary btn-sm" data-i18n="nav_login">Giriş Yap</a>
                <a href="kaydol.html" class="btn btn-primary btn-sm" data-i18n="nav_signup">Kaydol</a>
            </div>
            <div id="loggedInNav" style="display:none;">
                <a href="dashboard.html">Dashboard</a>
                <a href="detector.html" data-i18n="nav_analysis">Analiz</a>
                <span class="user-email" id="userEmail"></span>
                <button type="button" id="navLogout" class="btn btn-secondary btn-sm" data-i18n="nav_logout">Çıkış</button>
            </div>
            <div class="lang-dropdown">
                <button type="button" class="lang-dropdown-toggle" id="langDropdownToggle" aria-haspopup="true" aria-expanded="false" title="Language">
                    <span class="lang-current-flag" id="langCurrentFlag">🇹🇷</span>
                    <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="lang-dropdown-menu" id="langDropdownMenu" role="menu">
                    <button type="button" class="lang-option active" data-lang="tr" role="menuitem"><span class="lang-option-flag">🇹🇷</span> Türkçe<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                    <button type="button" class="lang-option" data-lang="en" role="menuitem"><span class="lang-option-flag">🇺🇸</span> English<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                    <button type="button" class="lang-option" data-lang="es" role="menuitem"><span class="lang-option-flag">🇪🇸</span> Español<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                </div>
            </div>
            <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

    <main class="page-auth">
        <div class="auth-container" id="verifyPanel">
            <div class="auth-logo"><img src="images/logo-square.webp" alt="MIA"></div>

            <div id="verifyPending" class="auth-status">
                <div class="auth-spinner"></div>
                <h2 data-i18n="verify_title">Hesabınız doğrulanıyor...</h2>
            </div>

            <div id="verifySuccess" class="auth-success" style="display:none;">
                <div class="auth-success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
                <h2 data-i18n="verify_success_title">Hesabınız aktif!</h2>
                <p data-i18n="verify_success_msg">MIA panelinize giriş yapabilirsiniz.</p>
                <div class="auth-success-actions">
                    <a href="dashboard.html" class="btn btn-primary btn-sm">Dashboard</a>
                </div>
            </div>

            <div id="verifyFail" class="auth-status" style="display:none;">
                <h2 data-i18n="verify_fail_title">Doğrulama başarısız</h2>
                <p style="color: var(--text-muted); margin: 0.75rem 0 1.5rem;" data-i18n="verify_fail_msg">Bağlantı geçersiz veya süresi dolmuş olabilir.</p>
                <div class="auth-success-actions">
                    <a href="kaydol.html" class="btn btn-secondary btn-sm" data-i18n="nav_signup">Kaydol</a>
                    <a href="giris-yap.html" class="btn btn-primary btn-sm" data-i18n="verify_back_login">Giriş Yap sayfasına dön</a>
                </div>
            </div>
        </div>
    </main>

    <footer><p data-i18n="footer">© 2026 MIA - Tüm hakları saklıdır.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</html>
