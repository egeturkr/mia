<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı — MIA</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="images/favicon-512.png">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A0A0A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('mia_theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .nf-wrap{min-height:calc(100vh - 88px);display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
        .nf-inner{max-width:520px;}
        .nf-code{font-size:clamp(5rem,18vw,9rem);font-weight:900;line-height:1;color:#D4AF37;letter-spacing:-2px;}
        .nf-title{font-size:1.6rem;font-weight:700;margin:8px 0 12px;color:var(--text);}
        .nf-text{color:var(--text-muted);font-size:1rem;line-height:1.7;margin:0 0 28px;}
        .nf-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/logo-horizontal-trim.png" alt="MIA" class="logo-img">
        </a>
        <nav>
            <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
            <a href="sirket.html" data-i18n="nav_company">Şirket</a>
            <a href="cozumler.html" data-i18n="nav_pricing">Çözümler</a>
            <a href="iletisim.html" data-i18n="nav_contact">İletişim</a>
            <div class="nav-divider"></div>
            <div id="loggedOutNav">
                <a href="giris-yap.html" class="btn btn-secondary btn-sm" data-i18n="nav_login">Giriş Yap</a>
                <a href="kaydol.html" class="btn btn-primary btn-sm" data-i18n="nav_signup">Kaydol</a>
            </div>
            <div id="loggedInNav" style="display:none;">
                <a href="dashboard.html">Dashboard</a>
                <a href="detector.html" data-i18n="nav_analysis">Analiz</a>
                <span class="user-email" id="userEmail"></span>
                <button type="button" id="navLogout" class="btn btn-secondary btn-sm" data-i18n="nav_logout">Çıkış</button>
            </div>
            <div class="lang-dropdown">
                <button type="button" class="lang-dropdown-toggle" id="langDropdownToggle" aria-haspopup="true" aria-expanded="false" aria-label="Dil seçimi / Select language" title="Language">
                    <span class="lang-current-flag" id="langCurrentFlag">🇹🇷</span>
                    <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="lang-dropdown-menu" id="langDropdownMenu" role="menu">
                    <button type="button" class="lang-option active" data-lang="tr" role="menuitem"><span class="lang-option-flag">🇹🇷</span> Türkçe<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                    <button type="button" class="lang-option" data-lang="en" role="menuitem"><span class="lang-option-flag">🇺🇸</span> English<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                    <button type="button" class="lang-option" data-lang="es" role="menuitem"><span class="lang-option-flag">🇪🇸</span> Español<svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>
                </div>
            </div>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Tema değiştir / Toggle theme" title="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        </nav>
    </header>

    <main>
        <div class="nf-wrap">
            <div class="nf-inner">
                <div class="nf-code">404</div>
                <h1 class="nf-title" data-i18n="nf_title">Sayfa bulunamadı</h1>
                <p class="nf-text" data-i18n="nf_text">Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfaya dönüp tekrar deneyebilirsiniz.</p>
                <div class="nf-actions">
                    <a href="index.html" class="btn btn-primary" data-i18n="nf_home">Ana Sayfaya Dön</a>
                    <a href="iletisim.html" class="btn btn-secondary" data-i18n="nf_contact">İletişime Geç</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
